server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the ingress, absolute redirects would point at port 8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Pages: browsers keep a copy but check for a newer one on every visit
    # (a cheap 304 when unchanged), so a deploy shows up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
